CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_74HC164_MATRIX_DRIVER=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y

# =============================================================
# トラックボール（PMW3610）の調整設定
# =============================================================

# 1. 基本のカーソル移動速度（CPI）
# 現在の 400 だとかなり遅いと感じるはずですので、まずは標準的な 1000 からお試しください
CONFIG_PMW3610_CPI=400

# 2. スナイプレイヤー（レイヤー5）作動時の速度（CPI）
CONFIG_PMW3610_SNIPE_CPI=200

# 3. スクロールレイヤー（レイヤー3, 4）作動時のスクロール感度
# 1回転あたりのスクロール量を半分近くに落としたい場合は、この数値を「4」や「8」に増やします
# （数値を大きくするほどスクロールの進みが遅く・しっとりになります）
CONFIG_PMW3610_SCROLL_DIVIDER=4

# 4. オートマウスレイヤー（レイヤー2）の維持猶予時間（ミリ秒）
# ボールを止めてから1秒間（1000ms）レイヤーを維持し、ポインタ操作の合間の誤作動やバタつきを抑えます
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=400
