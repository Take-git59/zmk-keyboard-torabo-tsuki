CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_74HC164_MATRIX_DRIVER=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y

# =============================================================
# トラックボール（PMW3610）の調整設定
# =============================================================

# 1. 基本のカーソル移動速度（CPI）
# 初期状態(400)だと遅いため、まずは使いやすい 1000 付近でお試しください
CONFIG_PMW3610_CPI=400

# 2. スナイプレイヤー（レイヤー5）作動時の速度（CPI）
CONFIG_PMW3610_SNIPE_CPI=200

# 3. スクロールレイヤー（レイヤー3, 4）作動時のスクロール感度
# 1回転あたりのスクロール量を少なく（遅く）したい場合は、この数値を増やします。
# デフォルト値はおよそ 16〜20 です。もしスクロール量を半分近くまで落としたい場合は、
# この数値を「32」や「40」などの大きめの値に増やして調整してください。
CONFIG_PMW3610_SCROLL_TICK=32
